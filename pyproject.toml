[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
description = "DFM ingestion + preprocessing utilities"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}        # tell setuptools the source root is src

[tool.setuptools.packages.find]
where = ["src"]                    # discover packages under src

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    ".venv312",
    "legacy",
    "build",
    "dist",
    "dataset",
    "results",
    "outputs",
]

