# config.yaml

# -------------------------
# Paths & data locations
# -------------------------
paths:
  remote_url: "https://www.stlouisfed.org/-/media/project/frbstl/stlouisfed/research/fred-md/monthly/current.csv?sc_lang=en&hash=80445D12401C59CF716410F3F7863B64"
  raw_filename: "fred_md_current.csv"

  processed_dir: "data/processed_data"
  panel_1965: "data/processed_data/panel_start_1965_keep_late.csv"
  panel_1960: "data/processed_data/panel_start_1960_drop_late.csv"

  panel_1965_fixhousing_delta: "data/processed_data/stationarity/panel_start_1965_keep_late_fixhousing_delta.csv"
  panel_1960_fixhousing_delta: "data/processed_data/stationarity/panel_start_1960_drop_late_fixhousing_delta.csv"

  # Targets
  targets_raw_dir: "data/raw_data/targets/gdp"
  targets_processed_dir: "data/processed_data/targets"

  # QC / metadata
  qc_dir: "data/quality_checks"
  meta_dir: "data/metadata"

  stationarity_original_1965: "data/quality_checks/stationarity/panel_start_1965_keep_late_stationarity.csv"
  stationarity_original_1960: "data/quality_checks/stationarity/panel_start_1960_drop_late_stationarity.csv"
  stationarity_fix_1965: "data/quality_checks/stationarity_fix/panel_start_1965_keep_late_fixhousing_delta_stationarity.csv"
  stationarity_fix_1960: "data/quality_checks/stationarity_fix/panel_start_1960_drop_late_fixhousing_delta_stationarity.csv"

  # Standardized panels/targets (outputs)
  dataset_root: "dataset"

  # Legacy untagged paths (kept only for compatibility)
  panel_z_1960_baseline: "dataset/1960_noVIX/baseline/X_panel_z.csv"
  panel_z_1965_baseline: "dataset/1965_withVIX/baseline/X_panel_z.csv"
  y_target_z_1960: "dataset/1960_noVIX/baseline/y_target_z.csv"
  y_target_z_1965: "dataset/1965_withVIX/baseline/y_target_z.csv"

  # COVID variant folders
  panel_z_1960_covid_winsor:  "dataset/1960_noVIX/covid_winsor/X_panel_z.csv"
  panel_z_1960_covid_dummies: "dataset/1960_noVIX/covid_dummies/X_panel_z.csv"
  panel_z_1960_covid_delete:  "dataset/1960_noVIX/covid_delete/X_panel_z.csv"

  panel_z_1965_covid_winsor:  "dataset/1965_withVIX/covid_winsor/X_panel_z.csv"
  panel_z_1965_covid_dummies: "dataset/1965_withVIX/covid_dummies/X_panel_z.csv"
  panel_z_1965_covid_delete:  "dataset/1965_withVIX/covid_delete/X_panel_z.csv"

  dummies_1960: "dataset/1960_noVIX/covid_dummies/dummies_monthly.csv"
  dummies_1965: "dataset/1965_withVIX/covid_dummies/dummies_monthly.csv"
  weights_1960: "dataset/1960_noVIX/covid_delete/W_estimation_weights.csv"
  weights_1965: "dataset/1965_withVIX/covid_delete/W_estimation_weights.csv"

# -------------------------
# Backtest configurations
# -------------------------
backtest:
  selected_config: "1960_noVIX_train1960_2015"
  configs:
    1960_noVIX_train1960_2015:  "data/metadata/backtest/1960_noVIX/backtest_config_train1960_2015.json"
    1965_withVIX_train1965_2015: "data/metadata/backtest/1965_withVIX/backtest_config_train1965_2015.json"

# -------------------------
# Date & parsing settings
# -------------------------
dates:
  date_col: "sasdate"
  parse_formats:
    - "%Y-%m-%d"   # quarterly target CSV format
    - "%m/%d/%Y"
    - "%m-%d-%Y"
  csv_format: "%m/%d/%Y"   # write format
  monthly_freq: "MS"       # Month-Start timestamps

# -------------------------
# Labeling & release lags
# -------------------------
labeling:
  monthly_index: "MS"                 # predictors and target use MS
  target_anchor: "quarter_end_month"  # GDP on Mar/Jun/Sep/Dec rows
  mm_mapping: true                    # Mariano–Murasawa measurement

release_lags:
  A191RL1Q225SBEA: "1M"               # GDP advance = +1 month after quarter end

# -------------------------
# FRED / ALFRED API (target variable)
# -------------------------
fred:
  api_url: "https://api.stlouisfed.org/fred/series/observations"
  series_id: "A191RL1Q225SBEA"

# -------------------------
# Preprocessing rules
# -------------------------
preprocessing:
  missing_share_max: 0.40
  leading_na_limit_months: 24
  interior_gap_max_months: 6
  min_obs_train_months: 36

  coverage_threshold: 0.75
  train_years: 30
  holdout_months: 60
  min_run_consecutive: 12

  extra_transforms:
    HOUSTMW: diff
    PERMITMW: diff
  applied_after_tcodes: true

# -------------------------
# Stationarity test defaults
# -------------------------
stationarity:
  alpha: 0.05
  kpss_reg: "ct"
  adf_autolag: "AIC"
  kpss_nlags: "auto"
  run_pp: true
  run_dfgls: true
  run_za: true
  pp_trend: "c"
  dfgls_trend: "c"
  za_reg: "ct"

# -------------------------
# COVID handling
# -------------------------
covid:
  window_start: "2020-03"
  window_end: "2020-09"
  winsor_clip_sigma: 6.0








